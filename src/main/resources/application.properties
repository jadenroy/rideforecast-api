spring.application.name=rideforecast-api
server.port=${PORT:8080}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Local/dev fallback. In production, provide JDBC_DATABASE_URL, DB_USERNAME, and DB_PASSWORD.
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:h2:mem:rideforecast;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Limit quote-write bursts per client. PostgreSQL idempotency still protects retries across restarts.
rideforecast.submissions.max-per-minute=${QUOTE_SUBMISSION_MAX_PER_MINUTE:12}

# Firebase verifies identity only. PostgreSQL remains the source of truth for profiles and quotes.
rideforecast.auth.enabled=${AUTH_ENABLED:false}
rideforecast.auth.allow-anonymous-quotes=${ALLOW_ANONYMOUS_QUOTES:true}
rideforecast.auth.firebase-service-account-json=${FIREBASE_SERVICE_ACCOUNT_JSON:}
server.forward-headers-strategy=native
